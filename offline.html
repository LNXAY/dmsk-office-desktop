<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DMSK Office</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; font-family: "Segoe UI", system-ui, sans-serif; }
        main { text-align: center; max-width: 28rem; padding: 2rem; }
        h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
        p { color: #94a3b8; line-height: 1.5; }
        button { margin-top: 1rem; background: #fff; color: #0f172a; border: 0; border-radius: 6px; padding: .6rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <h1>Keine Verbindung</h1>
    <p>DMSK Office ist gerade nicht erreichbar. Prüfe deine Internetverbindung. Es wird automatisch alle paar Sekunden neu versucht.</p>
    <button id="retry" type="button">Jetzt erneut versuchen</button>
</main>
<script>
    const target = new URLSearchParams(location.search).get('to') || 'https://office.dmsk-media.de';
    const go = () => { location.href = target; };
    document.getElementById('retry').addEventListener('click', go);
    setInterval(go, 10000);
</script>
</body>
</html>
